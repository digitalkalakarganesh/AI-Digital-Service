<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>AI Requirement Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:#ffffff;
      padding:20px;
    }
    .box{
      max-width:700px;
      margin:auto;
      background:#1e293b;
      padding:25px;
      border-radius:10px;
    }
    h1{
      text-align:center;
      color:#38bdf8;
<p id="status">Analyzing requirements...</p>

<script>
setTimeout(()=>{
  document.getElementById("status").innerText =
  "Analysis complete. System ready to build.";
}, 2000);
</script>

    }
    ul{
      line-height:1.8;
    }
<p><strong>AI Analysis:</strong></p>
<ul>
  <li>Project complexity: Medium</li>
  <li>Estimated build time: 20–25 days</li>
  <li>Automation level: 70%</li>
  <li>Human intervention: Setup & approval only</li>
</ul>

    .note{
      background:#020617;
      padding:15px;
      border-left:4px solid #22c55e;
      margin-top:20px;
    }
    a{
      color:#22c55e;
      text-decoration:none;
      display:inline-block;
      margin-top:20px;
    }
  </style>
</head>
<body>

<script src="engine/core-engine.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const storedData = localStorage.getItem("aiRequirementData");

  if (!storedData) {
    document.getElementById("statusText").innerText = "No requirement data found.";
    return;
  }

  const realData = JSON.parse(storedData);
  const analysis = CoreEngine.analyzeRequirement(realData);

  // Status
  document.getElementById("statusText").innerHTML =
    "Status: Your project is <span style='color:#22c55e;'>Feasible</span>";

  // System Actions
  const systemList = document.getElementById("systemActions");
  analysis.systemActions.forEach(action => {
    const li = document.createElement("li");
    li.innerText = action;
    systemList.appendChild(li);
  });

  // Human Actions
  const humanList = document.getElementById("humanActions");
  analysis.humanActions.forEach(action => {
    const li = document.createElement("li");
    li.innerText = action;
    humanList.appendChild(li);
  });

  // Assumptions
  const assumptionList = document.getElementById("assumptions");
  analysis.assumptions.forEach(item => {
    const li = document.createElement("li");
    li.innerText = item;
    assumptionList.appendChild(li);
  });

});
</script>
</body>
</html>
