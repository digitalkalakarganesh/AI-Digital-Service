<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>AI Requirement Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:#ffffff;
      padding:20px;
    }

    .box{
      max-width:700px;
      margin:auto;
      background:#1e293b;
      padding:25px;
      border-radius:10px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
    }

    ul{
      line-height:1.8;
    }

    a{
      color:#22c55e;
      text-decoration:none;
      display:inline-block;
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>AI Requirement Analysis Result</h1>

  <p id="statusText">Analyzing...</p>

  <!-- NEW SECTION -->
  <h3>Project Analysis:</h3>
  <ul>
    <li><strong>Complexity:</strong> <span id="complexity"></span></li>
    <li><strong>Estimated Timeline:</strong> <span id="timeline"></span></li>
    <li><strong>Estimated Cost:</strong> <span id="cost"></span></li>
  </ul>

  <h3>System Actions:</h3>
  <ul id="systemActions"></ul>

  <h3>Human Actions Required:</h3>
  <ul id="humanActions"></ul>

  <h3>Assumptions:</h3>
  <ul id="assumptions"></ul>

  <a href="index.html">← Back to Home</a>

</div>

<script src="engine/core-engine.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const storedData = localStorage.getItem("aiRequirementData");

  if (!storedData) {
    document.getElementById("statusText").innerText = "No requirement data found.";
    return;
  }

  const realData = JSON.parse(storedData);
  const analysis = CoreEngine.analyzeRequirement(realData);

  // Status
  document.getElementById("statusText").innerHTML =
    "Status: Your project is <span style='color:#22c55e;'>" + analysis.feasibility + "</span>";

  // Complexity Section
  document.getElementById("complexity").innerText = analysis.complexityLevel;
  document.getElementById("timeline").innerText = analysis.estimatedDays;
  document.getElementById("cost").innerText = analysis.estimatedCost;

  // System Actions
  const systemList = document.getElementById("systemActions");
  analysis.systemActions.forEach(action => {
    const li = document.createElement("li");
    li.innerText = action;
    systemList.appendChild(li);
  });

  // Human Actions
  const humanList = document.getElementById("humanActions");
  analysis.humanActions.forEach(action => {
    const li = document.createElement("li");
    li.innerText = action;
    humanList.appendChild(li);
  });

  // Assumptions
  const assumptionList = document.getElementById("assumptions");
  analysis.assumptions.forEach(item => {
    const li = document.createElement("li");
    li.innerText = item;
    assumptionList.appendChild(li);
  });

});
</script>

</body>
</html>
